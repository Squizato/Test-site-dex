<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        select {
            padding: 10px;
            font-size: 1em;
            background-color: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        #searchBox {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            margin-bottom: 20px;
            font-size: 1.2em;
            background-color: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            text-align: center;
        }

        .pokemon-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .pokemon-item {
            background: linear-gradient(145deg, #333, #444);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            color: white;
            text-decoration: none;
            overflow: hidden;
        }

        .pokemon-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }

        .pokemon-item img {
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
        }

        .pokemon-name {
            font-size: 1.5em;
            margin: 10px 0;
            text-transform: capitalize;
            font-weight: bold;
        }

        .pokemon-id {
            font-size: 1.1em;
            color: #999;
        }

        .stat-container {
            margin-top: 20px;
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .stat-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .stat-info {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Pokédex</h1>

    <label for="generation">Escolha uma geração:</label>
    <select id="generation">
        <option value="1">Geração 1</option>
        <option value="2">Geração 2</option>
        <option value="3">Geração 3</option>
        <option value="4">Geração 4</option>
        <option value="5">Geração 5</option>
        <option value="6">Geração 6</option>
        <option value="7">Geração 7</option>
        <option value="8">Geração 8</option>
        <option value="9">Geração 9</option>
    </select>

    <input type="text" id="searchBox" placeholder="Pesquisar Pokémon..." />

    <div id="pokemonStats" class="stat-container"></div>

    <div class="pokemon-list" id="pokemonList"></div>

    <script>
        const BASE_URL = "https://pokeapi.co/api/v2/";
        let currentPokemons = [];

        async function getPokemonsByGeneration(generation) {
            const generationData = await fetch(`${BASE_URL}generation/${generation}/`)
                .then(response => response.json());

            let pokemons = [];
            for (let pokemon of generationData.pokemon_species) {
                const pokemonData = await fetch(pokemon.url)
                    .then(response => response.json())
                    .then(data => {
                        pokemons.push({ name: pokemon.name, id: data.id });
                    });
            }
            return pokemons;
        }

        async function mostrarPokemons(geracao) {
            const pokemonListDiv = document.getElementById('pokemonList');
            pokemonListDiv.innerHTML = '';
            const pokemonStatsDiv = document.getElementById('pokemonStats');
            pokemonStatsDiv.innerHTML = '';

            const pokemons = await getPokemonsByGeneration(geracao);
            currentPokemons = pokemons;

            pokemons.forEach(async (pokemon) => {
                const pokemonLink = document.createElement('a');
                pokemonLink.href = '#';
                pokemonLink.classList.add('pokemon-item');

                const pokemonData = await fetch(`${BASE_URL}pokemon/${pokemon.name}`)
                    .then(response => response.json());

                const pokemonImage = document.createElement('img');
                pokemonImage.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonData.id}.png`;
                pokemonImage.alt = pokemon.name;

                const pokemonNameElement = document.createElement('div');
                pokemonNameElement.classList.add('pokemon-name');
                pokemonNameElement.textContent = pokemon.name;

                const pokemonId = document.createElement('div');
                pokemonId.classList.add('pokemon-id');
                pokemonId.textContent = `#${pokemonData.id}`;

                pokemonLink.appendChild(pokemonImage);
                pokemonLink.appendChild(pokemonNameElement);
                pokemonLink.appendChild(pokemonId);

                pokemonLink.addEventListener('click', () => mostrarStats(pokemon.name));

                pokemonListDiv.appendChild(pokemonLink);
            });
        }

        async function mostrarStats(pokemonName) {
            const pokemonStatsDiv = document.getElementById('pokemonStats');
            
            const pokemonData = await fetch(`${BASE_URL}pokemon/${pokemonName}`)
                .then(response => response.json());

            const stats = pokemonData.stats.reduce((acc, stat) => {
                if (stat.stat.name === 'special-attack') {
                    acc['special-attack'] = stat.base_stat;
                } else if (stat.stat.name === 'special-defense') {
                    acc['special-defense'] = stat.base_stat;
                } else {
                    acc[stat.stat.name] = stat.base_stat;
                }
                return acc;
            }, {});

            const abilities = pokemonData.abilities.map(ability => ability.ability.name);

            pokemonStatsDiv.innerHTML = `
                <div class="stat-title">Stats de ${pokemonName.charAt(0).toUpperCase() + pokemonName.slice(1)}</div>
                <div class="stat-info">HP: ${stats.hp}</div>
                <div class="stat-info">Attack: ${stats.attack}</div>
                <div class="stat-info">Defense: ${stats.defense}</div>
                <div class="stat-info">Special Attack: ${stats['special-attack'] || 'N/A'}</div>
                <div class="stat-info">Special Defense: ${stats['special-defense'] || 'N/A'}</div>
                <div class="stat-info">Speed: ${stats.speed}</div>
                <div class="stat-info">Base Stat Total: ${Object.values(stats).reduce((a, b) => a + b, 0)}</div>
                <div class="stat-info"><strong>Habilidades:</strong></div>
                <ul>
                    ${abilities.map(ability => `<li>${ability}</li>`).join('')}
                </ul>
            `;
        }

        function searchPokemons() {
            const searchQuery = document.getElementById('searchBox').value.toLowerCase();
            const filteredPokemons = currentPokemons.filter(pokemon =>
                pokemon.name.toLowerCase().includes(searchQuery)
            );
            renderPokemonList(filteredPokemons);
        }

        function renderPokemonList(pokemons) {
            const pokemonListDiv = document.getElementById('pokemonList');
            pokemonListDiv.innerHTML = '';

            pokemons.forEach(async (pokemon) => {
                const pokemonLink = document.createElement('a');
                pokemonLink.href = '#';
                pokemonLink.classList.add('pokemon-item');

                const pokemonData = await fetch(`${BASE_URL}pokemon/${pokemon.name}`)
                    .then(response => response.json());

                const pokemonImage = document.createElement('img');
                pokemonImage.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemonData.id}.png`;
                pokemonImage.alt = pokemon.name;

                const pokemonNameElement = document.createElement('div');
                pokemonNameElement.classList.add('pokemon-name');
                pokemonNameElement.textContent = pokemon.name;

                const pokemonId = document.createElement('div');
                pokemonId.classList.add('pokemon-id');
                pokemonId.textContent = `#${pokemonData.id}`;

                pokemonLink.appendChild(pokemonImage);
                pokemonLink.appendChild(pokemonNameElement);
                pokemonLink.appendChild(pokemonId);

                pokemonLink.addEventListener('click', () => mostrarStats(pokemon.name));

                pokemonListDiv.appendChild(pokemonLink);
            });
        }

        mostrarPokemons(1);

        document.getElementById('generation').addEventListener('change', function () {
            const geracaoSelecionada = parseInt(this.value);
            mostrarPokemons(geracaoSelecionada);
        });

        document.getElementById('searchBox').addEventListener('input', searchPokemons);
    </script>
</body>
</html>
